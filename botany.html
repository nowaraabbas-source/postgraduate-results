<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتيجة قسم علم النبات - الدكتوراة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ==========================================================================
   منطقة التخصيص — عدّل هنا فقط وما تلمسش باقي الكود
   ========================================================================== */
:root{
  --ink:        #0F3D3E;
  --sage:       #4C7A6D;
  --parchment:  #F6F1E4;
  --gold:       #B08D57;
  --charcoal:   #22201B;
  --line:       #D9CFB8;
}
</style>
<style>
  .logo-fallback{ display:flex; }
  .logo-image{ display:none; }

  *{box-sizing:border-box;}
  body{ margin:0; background:var(--parchment); color:var(--charcoal); font-family:'Tajawal', sans-serif; min-height:100vh; }
  header{ background:var(--ink); color:var(--parchment); padding:36px 24px 44px; text-align:center; position:relative; }
  .back-link{ position:absolute; top:18px; right:20px; color:var(--parchment); opacity:.8; font-size:13px; text-decoration:none; }
  .back-link:hover{ opacity:1; }
  .logo-fallback{ width:78px;height:78px; margin:0 auto 14px; border-radius:50%; border:3px solid var(--gold); align-items:center; justify-content:center; position:relative; }
  .logo-fallback::before{ content:""; position:absolute; inset:6px; border:1px dashed var(--gold); border-radius:50%; }
  .logo-fallback span{ font-family:'Markazi Text', serif; font-weight:700; font-size:26px; color:var(--gold); }
  .logo-image{ width:78px; height:78px; margin:0 auto 14px; border-radius:50%; object-fit:cover; border:3px solid var(--gold); }
  header h1{ font-family:'Markazi Text', serif; font-weight:700; font-size:clamp(24px,4vw,34px); margin:0 0 6px; }
  header p{ margin:0; color:var(--gold); font-size:15px; letter-spacing:1px; }

  main{ max-width:640px; margin:-24px auto 60px; padding:0 20px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:6px; box-shadow:0 12px 30px -18px rgba(15,61,62,0.35); padding:26px; }

  .search-row{ display:flex; gap:10px; }
  .search-box{ flex:1; padding:13px 14px; border:1px solid var(--line); border-radius:5px; font-family:'Tajawal', sans-serif; font-size:16px; text-align:center; letter-spacing:1px; }
  .search-box:focus{ outline:2px solid var(--gold); border-color:var(--gold); }
  .search-btn{ background:var(--ink); color:#fff; border:none; padding:0 26px; border-radius:5px; font-family:'Tajawal', sans-serif; font-weight:700; font-size:15px; cursor:pointer; }
  .search-btn:hover{ background:var(--sage); }

  #result-area{ margin-top:20px; }
  .hint{ text-align:center; padding:30px 10px; color:var(--sage); font-size:14px; }
  .error-state{ text-align:center; padding:24px 10px; color:#A23B3B; font-size:14px; }

  .student-name{ font-family:'Markazi Text', serif; font-size:22px; color:var(--ink); text-align:center; margin-bottom:4px; }
  .student-id{ text-align:center; color:var(--sage); font-size:13px; margin-bottom:18px; }

  table{ width:100%; border-collapse:collapse; font-size:14px; margin-bottom:18px; }
  thead th{ background:var(--ink); color:var(--parchment); padding:10px 8px; text-align:right; font-weight:700; }
  tbody td{ padding:9px 8px; border-bottom:1px solid var(--line); }
  tbody tr:nth-child(even){ background:#FAF7EE; }

  .summary{ border-top:2px solid var(--gold); padding-top:14px; display:flex; flex-wrap:wrap; gap:10px 22px; justify-content:center; }
  .summary-item{ text-align:center; }
  .summary-item .label{ font-size:12px; color:var(--sage); margin-bottom:2px; }
  .summary-item .value{ font-size:15px; font-weight:700; color:var(--ink); }
  .summary-item.rating .value{ display:inline-block; background:var(--gold); color:#fff; padding:3px 14px; border-radius:20px; font-size:13.5px; }

  .notes-line{ text-align:center; margin-top:14px; font-size:12.5px; color:var(--sage); }

  footer{ text-align:center; color:var(--sage); font-size:12.5px; padding:24px 20px 30px; }
</style>
</head>
<body>

<header>
  <a class="back-link" href="index.html">→ الرئيسية</a>
  <div class="logo-fallback"><span>OMU</span></div>
  <img class="logo-image" src="assets/logo.png" alt="شعار الجامعة">
  <h1>نتيجة قسم علم النبات — الدكتوراة</h1>
  <p>كلية العلوم · مكتب الدراسات العليا</p>
</header>

<main>
  <div class="card">
    <div class="search-row">
      <input class="search-box" id="search-box" placeholder="أدخل الرقم الدراسي..." onkeydown="if(event.key==='Enter') handleSearch()">
      <button class="search-btn" onclick="handleSearch()">بحث</button>
    </div>
    <div id="result-area"><div class="hint">أدخل الرقم الدراسي واضغط "بحث" لعرض نتيجتك</div></div>
  </div>
</main>

<footer>البيانات معروضة للاطلاع فقط، ولا يمكن للزائر تعديلها أو رفع ملفات من عنده.</footer>

<script>
/* ==========================================================================
   إعدادات المسؤول — غيّر مسار ملف البيانات هنا فقط
   ========================================================================== */
const SOURCE = "data/botany.csv";
/* ========================================================================== */

const META_COLS = ["م", "اسم الطالب", "الرقم الدراسي", "الوحدات الدراسية", "المعدل الفصلي", "التقدير العام", "ملاحظات"];

let rows = [];
let courseCols = [];

async function loadData(){
  try{
    const res = await fetch(SOURCE, {cache:"no-store"});
    if(!res.ok) throw new Error("fetch failed");
    const csvText = await res.text();
    const parsed = XLSX.read(csvText, {type:"string"});
    const sheet = parsed.Sheets[parsed.SheetNames[0]];
    rows = XLSX.utils.sheet_to_json(sheet, {defval:""});
    if(rows.length){
      courseCols = Object.keys(rows[0]).filter(c => !META_COLS.includes(c));
    }
  }catch(err){
    document.getElementById('result-area').innerHTML =
      '<div class="error-state">تعذر تحميل بيانات النتيجة حاليًا. تأكد أن ملف "'+SOURCE+'" مرفوع في مكانه الصحيح.</div>';
  }
}

function handleSearch(){
  const query = document.getElementById('search-box').value.trim();
  const area = document.getElementById('result-area');

  if(!query){
    area.innerHTML = '<div class="hint">أدخل الرقم الدراسي واضغط "بحث" لعرض نتيجتك</div>';
    return;
  }

  const match = rows.find(r => String(r["الرقم الدراسي"]).trim() === query);

  if(!match){
    area.innerHTML = '<div class="hint">لا توجد نتيجة مطابقة لهذا الرقم</div>';
    return;
  }

  renderStudent(match);
}

function renderStudent(row){
  const area = document.getElementById('result-area');

  const studentCourses = courseCols
    .map(c => ({ course: c, grade: String(row[c]||"").trim() }))
    .filter(item => item.grade !== "");

  let html = `
    <div class="student-name">${row["اسم الطالب"]}</div>
    <div class="student-id">الرقم الدراسي: ${row["الرقم الدراسي"]}</div>
  `;

  if(studentCourses.length){
    html += '<table><thead><tr><th>المادة</th><th>الدرجة</th></tr></thead><tbody>';
    studentCourses.forEach(item => {
      html += `<tr><td>${item.course}</td><td>${item.grade}</td></tr>`;
    });
    html += '</tbody></table>';
  } else {
    html += '<div class="hint">لا توجد درجات مواد مسجلة بعد</div>';
  }

  html += '<div class="summary">';
  if(String(row["الوحدات الدراسية"]||"").trim()){
    html += `<div class="summary-item"><div class="label">الوحدات الدراسية</div><div class="value">${row["الوحدات الدراسية"]}</div></div>`;
  }
  if(String(row["المعدل الفصلي"]||"").trim()){
    html += `<div class="summary-item"><div class="label">المعدل الفصلي</div><div class="value">${row["المعدل الفصلي"]}</div></div>`;
  }
  if(String(row["التقدير العام"]||"").trim()){
    html += `<div class="summary-item rating"><div class="label">التقدير العام</div><div class="value">${row["التقدير العام"]}</div></div>`;
  }
  html += '</div>';

  if(String(row["ملاحظات"]||"").trim()){
    html += `<div class="notes-line">ملاحظات: ${row["ملاحظات"]}</div>`;
  }

  area.innerHTML = html;
}

loadData();
</script>
</body>
</html>
