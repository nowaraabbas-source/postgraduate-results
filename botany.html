<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتيجة قسم علم النبات - الدكتوراة</title>
<meta property="og:title" content="نتيجة الدكتوراه قسم علم النبات">
<meta property="og:description" content="جامعة عمر المختار - كلية العلوم - مكتب الدراسات العليا">
<meta property="og:image" content="https://nowaraabbas-source.github.io/postgraduate-results/assets/logo.png">
<meta property="og:url" content="https://nowaraabbas-source.github.io/postgraduate-results/botany.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="نتيجة الدكتوراه قسم علم النبات">
<meta name="twitter:image" content="https://nowaraabbas-source.github.io/postgraduate-results/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ==========================================================================
   منطقة التخصيص — عدّل هنا فقط وما تلمسش باقي الكود
   ========================================================================== */
:root{
  --ink:    #1B3E6E;   /* اللون الأساسي (الهيدر والجدول) */
  --accent: #2F5BA3;   /* لون الأزرار والشارات */
  --slate:  #64748B;   /* لون النصوص الثانوية */
  --bg:     #F3F6FB;   /* لون خلفية الصفحة */
  --line:   #DDE5F0;   /* لون الحدود الرفيعة */
}
</style>
<style>
  .logo-fallback{ display:none; }
  .logo-image{ display:block; }

  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:#222; font-family:'Tajawal', sans-serif; min-height:100vh; }

  header{ background:#fff; text-align:center; padding:36px 24px 28px; box-shadow:0 2px 0 var(--ink); position:relative; }
  .back-link{ position:absolute; top:20px; right:22px; color:var(--ink); opacity:.65; font-size:13px; text-decoration:none; transition:opacity .15s; }
  .back-link:hover{ opacity:1; }
  .logo-image{ display:block; height:140px; width:auto; max-width:280px; margin:0 auto 14px; object-fit:contain; }
  .state-line{ font-size:15px; font-weight:700; letter-spacing:1.5px; color:var(--ink); margin-bottom:6px; }
  header h1{ font-family:'Markazi Text', serif; font-weight:700; font-size:clamp(24px,4vw,32px); margin:0 0 4px; color:var(--ink); letter-spacing:.2px; }
  .office-line{ margin:0 0 14px; color:var(--ink); font-size:14.5px; font-weight:500; letter-spacing:.3px; opacity:.85; }
  .page-title{ display:inline-block; background:var(--accent); color:#fff; font-size:13px; font-weight:700; padding:5px 18px; border-radius:20px; }

  main{ max-width:600px; margin:-22px auto 60px; padding:0 20px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 14px 34px -18px rgba(27,62,110,0.32); padding:30px 28px; }

  .search-row{ display:flex; gap:10px; }
  .search-box{ flex:1; padding:13px 16px; border:1.5px solid var(--line); border-radius:9px; font-family:'Tajawal', sans-serif; font-size:16px; text-align:center; transition:border-color .15s; }
  .search-box:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(47,91,163,0.12); }
  .search-btn{ background:var(--ink); color:#fff; border:none; padding:0 28px; border-radius:9px; font-weight:700; font-size:15px; cursor:pointer; transition:background .15s; }
  .search-btn:hover{ background:var(--accent); }

  #result-area{ margin-top:24px; }
  .hint{ text-align:center; padding:30px 10px; color:var(--slate); font-size:14px; }
  .error-state{ text-align:center; padding:22px 10px; color:#B3413F; font-size:13.5px; }

  .student-name{ font-family:'Markazi Text', serif; font-weight:700; font-size:23px; color:var(--ink); text-align:center; margin-bottom:5px; }
  .student-id{ text-align:center; color:var(--slate); font-size:13px; margin-bottom:20px; letter-spacing:.3px; }

  table{ width:100%; border-collapse:collapse; font-size:14px; margin-bottom:20px; border-radius:10px; overflow:hidden; }
  thead th{ background:var(--ink); color:#fff; padding:11px 10px; text-align:right; font-weight:700; font-size:13px; }
  tbody td{ padding:11px 10px; border-bottom:1px solid var(--line); }
  tbody tr:nth-child(even){ background:#F7F9FC; }
  tbody tr:last-child td{ border-bottom:none; }

  .summary{ border-top:2px solid var(--line); padding-top:16px; display:flex; flex-wrap:wrap; gap:12px 24px; justify-content:center; }
  .summary-item{ text-align:center; }
  .summary-item .label{ font-size:12px; color:var(--slate); margin-bottom:4px; letter-spacing:.2px; }
  .summary-item .value{ font-size:15px; font-weight:700; color:var(--ink); }
  .summary-item.rating .value{ display:inline-block; background:var(--accent); color:#fff; padding:4px 16px; border-radius:20px; font-size:13.5px; }

  .notes-line{ text-align:center; margin-top:16px; font-size:12.5px; color:var(--slate); }

  footer{ text-align:center; color:var(--slate); font-size:12.5px; padding:26px 20px 34px; }
</style>
</head>
<body>

<header>
  <a class="back-link" href="index.html">→ الرئيسية</a>
  <img class="logo-image" src="assets/logo.png" alt="شعار الجامعة" onerror="this.style.display='none'">
  <div class="state-line">دولة ليبيا</div>
  <h1>جامعة عمر المختار</h1>
  <p class="office-line">مكتب الدراسات العليا - كلية العلوم</p>
  <div class="page-title">نتيجة قسم علم النبات — الدكتوراة</div>
</header>

<main>
  <div class="card">
    <div class="search-row">
      <input class="search-box" id="search-box" placeholder="أدخل الرقم الدراسي..." onkeydown="if(event.key==='Enter') handleSearch()">
      <button class="search-btn" onclick="handleSearch()">بحث</button>
    </div>
    <div id="result-area"><div class="hint">أدخل الرقم الدراسي واضغط "بحث" لعرض نتيجتك</div></div>
  </div>
</main>

<footer>البيانات معروضة للاطلاع فقط، ولا يمكن للزائر تعديلها أو رفع ملفات من عنده.</footer>

<script>
/* ==========================================================================
   إعدادات المسؤول — غيّر مسار ملف البيانات هنا فقط
   ========================================================================== */
const SOURCE = "data/botany.csv";
/* ========================================================================== */

const META_COLS = ["م", "اسم الطالب", "الرقم الدراسي", "الوحدات الدراسية", "المعدل الفصلي", "التقدير العام", "ملاحظات"];

let rows = [];
let courseCols = [];

async function loadData(){
  try{
    const res = await fetch(SOURCE, {cache:"no-store"});
    if(!res.ok) throw new Error("fetch failed");
    const csvText = await res.text();
    const parsed = XLSX.read(csvText, {type:"string"});
    const sheet = parsed.Sheets[parsed.SheetNames[0]];
    rows = XLSX.utils.sheet_to_json(sheet, {defval:""});
    if(rows.length){
      courseCols = Object.keys(rows[0]).filter(c => !META_COLS.includes(c));
    }
  }catch(err){
    document.getElementById('result-area').innerHTML =
      '<div class="error-state">تعذر تحميل بيانات النتيجة حاليًا. تأكد أن ملف "'+SOURCE+'" مرفوع في مكانه الصحيح.</div>';
  }
}

function handleSearch(){
  const query = document.getElementById('search-box').value.trim();
  const area = document.getElementById('result-area');

  if(!query){
    area.innerHTML = '<div class="hint">أدخل الرقم الدراسي واضغط "بحث" لعرض نتيجتك</div>';
    return;
  }

  const match = rows.find(r => String(r["الرقم الدراسي"]).trim() === query);

  if(!match){
    area.innerHTML = '<div class="hint">لا توجد نتيجة مطابقة لهذا الرقم</div>';
    return;
  }

  renderStudent(match);
}

function renderStudent(row){
  const area = document.getElementById('result-area');

  const studentCourses = courseCols
    .map(c => ({ course: c, grade: String(row[c]||"").trim() }))
    .filter(item => item.grade !== "");

  let html = `
    <div class="student-name">${row["اسم الطالب"]}</div>
    <div class="student-id">الرقم الدراسي: ${row["الرقم الدراسي"]}</div>
  `;

  if(studentCourses.length){
    html += '<table><thead><tr><th>المادة</th><th>الدرجة</th></tr></thead><tbody>';
    studentCourses.forEach(item => {
      html += `<tr><td>${item.course}</td><td>${item.grade}</td></tr>`;
    });
    html += '</tbody></table>';
  } else {
    html += '<div class="hint">لا توجد درجات مواد مسجلة بعد</div>';
  }

  html += '<div class="summary">';
  if(String(row["الوحدات الدراسية"]||"").trim()){
    html += `<div class="summary-item"><div class="label">الوحدات الدراسية</div><div class="value">${row["الوحدات الدراسية"]}</div></div>`;
  }
  if(String(row["المعدل الفصلي"]||"").trim()){
    const gpaRaw = String(row["المعدل الفصلي"]).trim();
    const normalized = gpaRaw
      .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
      .replace(/[^0-9.,]/g, '')
      .replace(',', '.');
    const gpaNum = parseFloat(normalized);
    let gpaDisplay = gpaRaw;
    if(!isNaN(gpaNum)){
      const pct = gpaNum <= 1 ? gpaNum * 100 : gpaNum;
      gpaDisplay = pct.toFixed(1).replace(/\.0$/, '') + '%';
    }
    html += `<div class="summary-item"><div class="label">المعدل الفصلي</div><div class="value">${gpaDisplay}</div></div>`;
  }
  if(String(row["التقدير العام"]||"").trim()){
    html += `<div class="summary-item rating"><div class="label">التقدير العام</div><div class="value">${row["التقدير العام"]}</div></div>`;
  }
  html += '</div>';

  if(String(row["ملاحظات"]||"").trim()){
    html += `<div class="notes-line">ملاحظات: ${row["ملاحظات"]}</div>`;
  }

  area.innerHTML = html;
}

loadData();
</script>
</body>
</html>
