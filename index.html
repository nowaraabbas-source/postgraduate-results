<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتيجة الدراسات العليا - مرحلة الدكتوراة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   منطقة التخصيص — عدّل هنا فقط وما تلمسش باقي الكود
   ========================================================================== */
:root{
  --ink:    #1B3E6E;
  --accent: #2F5BA3;
  --slate:  #64748B;
  --bg:     #F3F6FB;
  --line:   #DDE5F0;
}
</style>
<style>
  .logo-fallback{ display:none; }
  .logo-image{ display:block; }

  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:#222; font-family:'Tajawal', sans-serif; min-height:100vh; }

  header{ background:#fff; text-align:center; padding:40px 24px 30px; border-bottom:3px solid var(--ink); }
  .logo-image{ height:92px; width:auto; margin:0 auto 14px; object-fit:contain; }
  header h1{ font-family:'Markazi Text', serif; font-weight:700; font-size:clamp(26px,4vw,36px); margin:0 0 6px; color:var(--ink); }
  header p{ margin:0; color:var(--slate); font-size:14px; }

  main{ max-width:640px; margin:-20px auto 60px; padding:0 20px; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:600px){ .grid{ grid-template-columns:1fr; } }

  .dept-card{
    background:#fff; border:1px solid var(--line); border-radius:10px;
    box-shadow:0 10px 26px -16px rgba(27,62,110,0.30);
    padding:30px 20px; text-align:center; text-decoration:none; color:#222;
    transition:transform .15s, box-shadow .15s; display:block;
  }
  .dept-card:hover{ transform:translateY(-3px); box-shadow:0 14px 30px -14px rgba(27,62,110,0.40); }
  .dept-card .icon{ font-size:32px; margin-bottom:10px; }
  .dept-card h2{ font-family:'Markazi Text', serif; font-size:20px; margin:0 0 6px; color:var(--ink); }
  .dept-card p{ margin:0; font-size:13px; color:var(--slate); }

  footer{ text-align:center; color:var(--slate); font-size:12.5px; padding:0 20px 30px; }
</style>
</head>
<body>

<header>
  <img class="logo-image" src="assets/logo.png" alt="شعار الجامعة">
  <h1>نتيجة الدراسات العليا — مرحلة الدكتوراة</h1>
  <p>كلية العلوم · مكتب الدراسات العليا</p>
</header>

<main>
  <div class="grid">
    <a class="dept-card" href="zoology.html">
      <div class="icon">🦎</div>
      <h2>قسم علم الحيوان</h2>
      <p>عرض النتيجة بالرقم الدراسي</p>
    </a>
    <a class="dept-card" href="botany.html">
      <div class="icon">🌿</div>
      <h2>قسم علم النبات</h2>
      <p>عرض النتيجة بالرقم الدراسي</p>
    </a>
  </div>
</main>

<footer>كلية العلوم — جامعة عمر المختار</footer>

</body>
</html>
