<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتيجة الدراسات العليا - مرحلة الدكتوراة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   منطقة التخصيص — عدّل هنا فقط وما تلمسش باقي الكود
   ========================================================================== */
:root{
  --ink:    #1B3E6E;
  --accent: #2F5BA3;
  --slate:  #64748B;
  --bg:     #F3F6FB;
  --line:   #DDE5F0;
}
</style>
<style>
  .logo-fallback{ display:none; }
  .logo-image{ display:block; }

  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:#222; font-family:'Tajawal', sans-serif; min-height:100vh; }

  header{ background:#fff; text-align:center; padding:44px 24px 32px; box-shadow:0 2px 0 var(--ink); }
  .logo-image{ display:block; height:160px; width:auto; max-width:320px; margin:0 auto 16px; object-fit:contain; }
  .state-line{ font-size:12.5px; letter-spacing:2px; color:var(--slate); margin-bottom:4px; }
  header h1{ font-family:'Markazi Text', serif; font-weight:700; font-size:clamp(26px,4vw,36px); margin:0 0 4px; color:var(--ink); letter-spacing:.2px; }
  .office-line{ margin:0; color:var(--ink); font-size:14.5px; font-weight:500; letter-spacing:.3px; opacity:.85; }

  main{ max-width:640px; margin:-24px auto 60px; padding:0 20px; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  @media (max-width:600px){ .grid{ grid-template-columns:1fr; } }

  .dept-card{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    box-shadow:0 14px 34px -18px rgba(27,62,110,0.32);
    padding:34px 22px; text-align:center; text-decoration:none; color:#222;
    transition:transform .18s, box-shadow .18s; display:block;
  }
  .dept-card:hover{ transform:translateY(-4px); box-shadow:0 18px 38px -16px rgba(27,62,110,0.42); }
  .dept-card .icon{ font-size:34px; margin-bottom:12px; }
  .dept-card h2{ font-family:'Markazi Text', serif; font-size:21px; margin:0 0 8px; color:var(--ink); }
  .dept-card p{ margin:0; font-size:13px; color:var(--slate); }

  footer{ text-align:center; color:var(--slate); font-size:12.5px; padding:26px 20px 34px; }
</style>
</head>
<body>

<header>
  <img class="logo-image" src="assets/logo .jpg" alt="شعار الجامعة" onerror="this.style.display='none'">
  <div class="state-line">دولة ليبيا</div>
  <h1>جامعة عمر المختار</h1>
  <p class="office-line">مكتب الدراسات العليا - كلية العلوم</p>
</header>

<main>
  <div class="grid">
    <a class="dept-card" href="zoology.html">
      <div class="icon">🦎</div>
      <h2>قسم علم الحيوان</h2>
      <p>عرض النتيجة بالرقم الدراسي</p>
    </a>
    <a class="dept-card" href="botany.html">
      <div class="icon">🌿</div>
      <h2>قسم علم النبات</h2>
      <p>عرض النتيجة بالرقم الدراسي</p>
    </a>
  </div>
</main>

<footer>كلية العلوم — جامعة عمر المختار</footer>

</body>
</html>
